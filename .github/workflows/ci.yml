name: CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - develop
  push:
    branches:
      - develop

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Biome (lint + format)
        run: pnpm exec biome check .

      - name: TypeScript (server)
        run: pnpm --filter @nepp-chan/server exec tsc --noEmit

      - name: TypeScript (web)
        run: pnpm --filter @nepp-chan/web exec tsc --noEmit

      - name: TypeScript (lp)
        run: pnpm --filter @nepp-chan/lp exec tsc --noEmit

      - name: TypeScript (widget)
        run: pnpm --filter @nepp-chan/widget exec tsc --noEmit

  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Run tests with coverage
        run: pnpm test:cov

      - name: Upload server coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-server
          path: server/coverage/
          retention-days: 14

      - name: Upload web coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-web
          path: web/coverage/
          retention-days: 14

      - name: Upload shared coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-shared
          path: shared/coverage/
          retention-days: 14

      - name: Upload widget coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-widget
          path: widget/coverage/
          retention-days: 14

      - name: Report coverage (server)
        if: always()
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          name: server
          json-summary-path: server/coverage/coverage-summary.json
          vite-config-path: server/vitest.config.ts

      - name: Report coverage (web)
        if: always()
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          name: web
          json-summary-path: web/coverage/coverage-summary.json
          vite-config-path: web/vitest.config.ts

      - name: Report coverage (shared)
        if: always()
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          name: shared
          json-summary-path: shared/coverage/coverage-summary.json
          vite-config-path: shared/vitest.config.ts

      - name: Report coverage (widget)
        if: always()
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          name: widget
          json-summary-path: widget/coverage/coverage-summary.json
          vite-config-path: widget/vitest.config.ts
