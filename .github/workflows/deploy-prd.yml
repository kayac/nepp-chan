name: Deploy to Production

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-server:
    name: Deploy Server
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Run DB Migrations
        run: pnpm db:migrate:prd
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy Server
        run: pnpm server:deploy:prd
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  deploy-web:
    name: Deploy Web
    runs-on: ubuntu-latest
    needs: deploy-server
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Deploy Web
        run: pnpm web:deploy:prd
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PUBLIC_API_URL: https://api.nepp-chan.ai
          PUBLIC_LP_URL: https://nepp-chan.ai
          PUBLIC_GA_MEASUREMENT_ID: G-FMW4FP326K
          PUBLIC_SENTRY_DSN: ${{ secrets.SENTRY_DSN_WEB }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT_WEB: ${{ secrets.SENTRY_PROJECT_WEB }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

  deploy-lp:
    name: Deploy LP
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Deploy LP
        run: pnpm lp:deploy:prd
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PUBLIC_API_URL: https://api.nepp-chan.ai
          PUBLIC_WEB_URL: https://web.nepp-chan.ai
          PUBLIC_GA_MEASUREMENT_ID: G-FMW4FP326K
          VITE_API_URL: https://api.nepp-chan.ai
          VITE_WEB_URL: https://web.nepp-chan.ai
          VITE_GA_MEASUREMENT_ID: G-FMW4FP326K
